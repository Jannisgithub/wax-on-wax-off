name: WaxOnWaxOff
options:
  bundleIdPrefix: com.jannis
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: QXUZR3C892
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
    CLANG_ENABLE_MODULES: YES
targets:
  WaxOnWaxOff:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Resources
      - path: App/Resources/Assets.xcassets
        buildPhase: resources
      - path: App/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    entitlements:
      path: App/Resources/WaxOnWaxOff.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jannis.waxonwaxoff
        PRODUCT_NAME: WaxOnWaxOff
        INFOPLIST_FILE: App/Resources/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "16"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      testTargets:
        - WaxOnWaxOffTests
  WaxOnWaxOffTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: WaxOnWaxOff
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jannis.waxonwaxoff.tests
        GENERATE_INFOPLIST_FILE: YES
